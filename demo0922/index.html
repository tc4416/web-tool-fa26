<!doctype html>
<html lang="en">
  <head>
    <style>
      body {
        background-color: pink;
        min-height: 100vh;
      }

      #mySquare {
        width: 100px;
        height: 100px;
        border: 1px solid black;
        position: absolute;
      }

      #check {
        position: absolute;
        top: 50vh;
        left: 50vw;
      }
    </style>
  </head>

  <body>
    <h1>Mouse Over Example</h1>
    <div id="mySquare"></div>
    <div id="check">
          <input type="checkbox" id="box" />
      <label for="box">?</label>
    </div>

    <script src="myScript.js"></script>
  </body>
</html>
